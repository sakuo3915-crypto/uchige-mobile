<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a35"><title>縦シューティング タッチ移動版 | ウチゲー（仮）</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overscroll-behavior:none}body{font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif;background:#0b1024;color:#fff;display:flex;justify-content:center}#app{width:min(100%,480px);height:100dvh;display:flex;flex-direction:column;min-height:0;background:#101a35;overflow:hidden}.top{height:46px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 12px;background:#172445;font-size:13px;font-weight:800}.top small{font-size:10px;color:#b6c8eb}.health{color:#ff9aa9}#field{flex:1;min-height:0;position:relative;background:#19294d;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#notice{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:14px;font-weight:900;text-shadow:0 2px 4px #000;pointer-events:none}#overlay{position:absolute;inset:0;background:#09132bdc;display:flex;align-items:center;justify-content:center;padding:18px}#overlay.hidden{display:none}.panel{background:#1e2b52;border:2px solid #ffd56e;border-radius:18px;padding:24px 20px;width:100%;max-width:330px;text-align:center;box-shadow:0 14px 40px #0008}.panel h1{font-size:25px;margin:0 0 12px;color:#ffe17a}.panel p{line-height:1.75;font-size:14px;color:#e3e9ff}button{border:0;font:inherit;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}#start{background:#ffd263;color:#202444;padding:14px 35px;border-radius:14px;font-size:18px;margin-top:10px}.controls{height:clamp(105px,17dvh,135px);flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 24px max(10px,env(safe-area-inset-bottom));background:#121c37;touch-action:none}.stick{width:128px;height:128px;border:2px solid #6e85b6;background:radial-gradient(circle,#293b63,#1a2749);border-radius:50%;position:relative;touch-action:none;user-select:none}.stick:before,.stick:after{content:'';position:absolute;background:#536b9c;opacity:.7;left:50%;top:50%;transform:translate(-50%,-50%)}.stick:before{width:80px;height:2px}.stick:after{height:80px;width:2px}.knob{position:absolute;left:50%;top:50%;width:55px;height:55px;border-radius:50%;background:linear-gradient(#a5b9e5,#6682bc);border:3px solid #d5e3ff;transform:translate(-50%,-50%);box-shadow:0 4px 12px #0006;pointer-events:none}.fire{width:105px;height:105px;border-radius:50%;background:linear-gradient(#ffda71,#ee963f);border:4px solid #ffe8a4;color:#382541;box-shadow:0 7px 0 #9d532e;font-size:20px;touch-action:none}.fire.pressed{transform:translateY(4px);box-shadow:0 3px 0 #9d532e}.movehint{font-size:14px;color:#c9d8f5;text-align:center;line-height:1.7;padding:12px}.footer{font-size:10px;text-align:center;color:#99a9cc;padding:3px 0;background:#121c37}@media(max-height:620px){.controls{height:125px}.stick{width:105px;height:105px}.fire{width:90px;height:90px}.top{height:38px}.footer{display:none}}
</style></head><body><div id="app"><div class="top"><div>ウチゲー <small>縦シューティング試作</small></div><div id="stage">STAGE 1/2</div><div class="health" id="hp">♥ ♥ ♥ ♥ ♥</div></div><div id="field"><canvas id="game"></canvas><div id="notice"></div><div id="overlay"><div class="panel"><h1 id="title">あいつをラスボスに！</h1><p id="desc">スマホで遊ぶ縦シューティングの試作品。<br>ゲーム画面を指でなぞって上下左右に移動。<br>右の攻撃ボタンを押しっぱなしで連射！<br><br>敵を2人倒したらクリア！</p><button id="start">ゲーム開始</button></div></div></div><div class="controls"><div class="movehint">☝️<br>画面をなぞって移動</div><button class="fire" id="fire" aria-label="攻撃">⚡<br>攻撃</button></div><div class="footer">画面をドラッグして移動｜右下の攻撃を長押し</div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),field=document.getElementById('field'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),desc=document.getElementById('desc'),start=document.getElementById('start'),notice=document.getElementById('notice'),hpEl=document.getElementById('hp'),stageEl=document.getElementById('stage'),fire=document.getElementById('fire');let W=360,H=560,scale=1,mode='menu',last=0,fireHeld=false,joy={x:0,y:0},dragPointer=null,dragX=0,dragY=0,firePointer=null,keys={},player,enemy,bullets=[],ebullets=[],particles=[],stars=[],stage=0,shotTimer=0,enemyShot=0,transition=0,flash=0,elapsed=0;
function resize(){const r=field.getBoundingClientRect();W=Math.max(200,r.width);H=Math.max(250,r.height);scale=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);stars=Array.from({length:35},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.5,s:15+Math.random()*28}));if(player){player.x=Math.min(W-24,player.x);player.y=Math.min(H-26,player.y)}}window.addEventListener('resize',resize);resize();
function reset(){endDrag();player={x:W/2,y:H*.79,hp:5,inv:0};stage=0;bullets=[];ebullets=[];particles=[];shotTimer=0;enemyShot=1;elapsed=0;transition=0;flash=0;spawnEnemy();mode='play';overlay.classList.add('hidden');updateHUD();setNotice('シュウが あらわれた！',1.6)}function spawnEnemy(){enemy={x:W/2,y:100,baseY:100,hp:stage===0?20:34,max:stage===0?20:34,t:0,name:stage===0?'シュウ':'カイ',color:stage===0?'#a97fe5':'#76caa0'};ebullets=[];stageEl.textContent=`STAGE ${stage+1}/2`;}
let noticeUntil=0;function setNotice(s,sec){notice.textContent=s;noticeUntil=elapsed+sec}function updateHUD(){hpEl.textContent='♥ '.repeat(Math.max(0,player.hp)).trim()||'HP 0';stageEl.textContent=`STAGE ${stage+1}/2`}
function end(win){mode=win?'win':'lose';overlay.classList.remove('hidden');title.textContent=win?'クリア！ おめでとう！':'ゲームオーバー';desc.innerHTML=win?'シュウとカイを撃破！<br>これがスマホ版の操作イメージです。<br>登場人物や攻撃は注文ごとに変更できます。':'敵の攻撃にやられてしまった！<br>もう一度挑戦してみよう。';start.textContent='もう一度遊ぶ';fireHeld=false;endDrag();fire.classList.remove('pressed')}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.4,color})}}
function update(dt){elapsed+=dt;stars.forEach(s=>{s.y+=s.s*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});if(mode!=='play')return;if(noticeUntil<elapsed)notice.textContent='';if(player.inv>0)player.inv-=dt;if(flash>0)flash-=dt;
let dx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}player.x=Math.max(22,Math.min(W-22,player.x+dx*215*dt));player.y=Math.max(H*.34,Math.min(H-26,player.y+dy*215*dt));
if(transition>0){transition-=dt;if(transition<=0){stage++;if(stage>=2){end(true);return}spawnEnemy();setNotice('カイが あらわれた！',1.6)}return}
enemy.t+=dt;enemy.x=W/2+Math.sin(enemy.t*(stage===0?1.25:1.9))*Math.min(W*.3,115);enemy.y=enemy.baseY+Math.sin(enemy.t*2)*16;shotTimer-=dt;if((fireHeld||keys[' ']||keys.Enter)&&shotTimer<=0){bullets.push({x:player.x,y:player.y-24,vy:-510});shotTimer=.14}enemyShot-=dt;if(enemyShot<=0){let a=Math.atan2(player.y-enemy.y,player.x-enemy.x),count=stage===0?2:3;for(let i=0;i<count;i++){let off=(i-(count-1)/2)*.23,spd=stage===0?110:135;ebullets.push({x:enemy.x,y:enemy.y+27,vx:Math.cos(a+off)*spd,vy:Math.sin(a+off)*spd,r:stage===0?7:8})}enemyShot=stage===0?1.15:.84}
for(const b of bullets)b.y+=b.vy*dt;for(const b of ebullets){b.x+=b.vx*dt;b.y+=b.vy*dt}for(const b of bullets){if(Math.hypot(b.x-enemy.x,b.y-enemy.y)<38){b.dead=true;enemy.hp--;burst(b.x,b.y,'#ffe88b',3);if(enemy.hp<=0){burst(enemy.x,enemy.y,enemy.color,38);setNotice(`${enemy.name}を たおした！`,2);transition=1.5;ebullets=[];bullets=[];break}}}if(player.inv<=0){for(const b of ebullets){if(Math.hypot(b.x-player.x,b.y-player.y)<22+b.r*.5){b.dead=true;player.hp--;player.inv=1.2;flash=.22;burst(player.x,player.y,'#ff9aa9',16);updateHUD();if(player.hp<=0){end(false);return}break}}}bullets=bullets.filter(b=>!b.dead&&b.y>-20);ebullets=ebullets.filter(b=>!b.dead&&b.y<H+25&&b.x>-25&&b.x<W+25)}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function character(x,y,hero,color){ctx.save();ctx.translate(x,y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,28,26,8,0,0,Math.PI*2);ctx.fill();rounded(-22,9,44,35,12,color);circle(0,-13,24,hero?'#efc39d':'#f2bda1');if(hero){ctx.strokeStyle='#403b43';ctx.lineWidth=2.8;ctx.beginPath();ctx.arc(-9,-12,8,0,Math.PI*2);ctx.moveTo(-1,-12);ctx.lineTo(1,-12);ctx.moveTo(1,-12);ctx.arc(9,-12,8,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#9d705d';ctx.beginPath();ctx.arc(0,-22,18,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}else{ctx.fillStyle=stage===0?'#573d63':'#3d6757';ctx.beginPath();ctx.arc(0,-18,24,Math.PI,Math.PI*2);ctx.lineTo(24,-16);ctx.lineTo(-24,-16);ctx.fill();circle(-8,-10,3,'#263044');circle(8,-10,3,'#263044');ctx.strokeStyle='#6c3c45';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-3,7,0,Math.PI);ctx.stroke()}ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#233a6c');g.addColorStop(1,'#101a35');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);stars.forEach(s=>circle(s.x,s.y,s.r,'#ffffff77'));ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
if(enemy&&mode!=='menu'){rounded(W*.16,14,W*.68,11,6,'#24314d');rounded(W*.16,14,W*.68*Math.max(0,enemy.hp/enemy.max),11,6,'#ff788f');ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(`VS ${enemy.name}`,W/2,43);if(transition<=0)character(enemy.x,enemy.y,false,enemy.color)}if(player&&mode!=='menu'){ctx.globalAlpha=player.inv>0&&Math.floor(elapsed*12)%2===0?.35:1;character(player.x,player.y,true,'#5ab8e1');ctx.globalAlpha=1}ctx.fillStyle='#ffe56f';for(const b of bullets){rounded(b.x-4,b.y-14,8,21,4,'#ffe56f');circle(b.x,b.y-14,6,'#fff3b2')}for(const b of ebullets){circle(b.x,b.y,b.r,'#ff8c8f');circle(b.x-2,b.y-2,2,'#fff1bb')}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);circle(p.x,p.y,2.5,p.color)}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle='#ff77772c';ctx.fillRect(0,0,W,H)}}
function frame(ts){let dt=Math.min((ts-last)/1000||0,.04);last=ts;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);start.addEventListener('click',reset);
function endDrag(){dragPointer=null}
canvas.addEventListener('pointerdown',e=>{if(mode!=='play'||dragPointer!==null)return;dragPointer=e.pointerId;dragX=e.clientX;dragY=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==dragPointer||mode!=='play')return;const r=canvas.getBoundingClientRect();const sx=W/r.width,sy=H/r.height;const dx=(e.clientX-dragX)*sx,dy=(e.clientY-dragY)*sy;player.x=Math.max(22,Math.min(W-22,player.x+dx));player.y=Math.max(H*.34,Math.min(H-26,player.y+dy));dragX=e.clientX;dragY=e.clientY;e.preventDefault()});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(e.pointerId===dragPointer)endDrag()});
fire.addEventListener('pointerdown',e=>{if(firePointer!==null)return;firePointer=e.pointerId;fire.setPointerCapture(e.pointerId);fireHeld=true;fire.classList.add('pressed');e.preventDefault()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,e=>{if(e.pointerId===firePointer){firePointer=null;fireHeld=false;endDrag();fire.classList.remove('pressed')}});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys[e.key]=true});window.addEventListener('keyup',e=>{keys[e.key]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){fireHeld=false;keys={};endDrag()}});
})();
</script></body></html>
