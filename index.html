<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b38"><title>ウチゲー（仮） | 本番仕様テスト v4</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:system-ui,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:#0b1530;color:#fff;display:flex;justify-content:center}button{font:inherit;border:0;font-weight:900;touch-action:none;-webkit-tap-highlight-color:transparent}#app{width:min(100%,470px);height:100dvh;display:flex;flex-direction:column;background:#0d1a39;overflow:hidden}.top{flex:none;height:51px;display:flex;align-items:center;gap:9px;padding:5px 12px;background:linear-gradient(95deg,#173d7c,#14234d);border-bottom:2px solid #58d8ff}.brand{color:#ffd850;font-size:18px;font-weight:1000;letter-spacing:1px;text-shadow:2px 2px #0b1228}.topInfo{flex:1;min-width:0}.topInfo b{display:block;font-size:12px;white-space:nowrap}.hpbar{border:2px solid #d2e7ff;border-radius:20px;height:11px;overflow:hidden;background:#17213d;margin-top:3px}.hpbar span{display:block;background:linear-gradient(90deg,#27cb88,#b7ef55);height:100%;width:100%}.pause{background:#224c91;color:white;border:2px solid #95deff;border-radius:11px;font-size:17px;padding:5px 10px}#field{position:relative;flex:1;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#speech{position:absolute;top:67px;left:8px;right:8px;text-align:center;font-size:clamp(15px,4.4vw,21px);font-weight:1000;line-height:1.25;color:#fff;text-shadow:-2px -2px #182b60,2px -2px #182b60,-2px 2px #182b60,2px 2px #182b60,0 3px 5px #000;pointer-events:none;min-height:28px}#overlay{position:absolute;inset:0;background:#08132ce8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:3}#overlay.hidden{display:none}.panel{width:100%;max-width:350px;background:#1b3262;border:3px solid #ffd056;border-radius:23px;text-align:center;padding:23px 18px;box-shadow:0 15px 40px #0009}.panel h1{color:#ffe27c;font-size:26px;line-height:1.3;margin:0 0 11px}.panel p{line-height:1.7;color:#e2ebff;font-size:14px}.panel button{background:#ffca4a;color:#1a2a4c;border-radius:15px;padding:13px 30px;font-size:18px;box-shadow:0 5px #b56c23}.controls{flex:none;height:clamp(139px,23dvh,180px);background:linear-gradient(135deg,#113d7b,#111b39);display:flex;gap:12px;align-items:center;padding:9px 13px max(9px,env(safe-area-inset-bottom));border-top:3px solid #59caff;touch-action:none;user-select:none;-webkit-user-select:none}#pad{height:100%;min-height:97px;flex:1;max-width:230px;border:2px solid #7cabec;border-radius:20px;position:relative;background:radial-gradient(circle at center,#305c94,#1b315b 75%);touch-action:none;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}#pad.active{border-color:#fff2a2}.stickOuter{position:relative;width:min(100px,23vw);height:min(100px,23vw);border-radius:50%;background:linear-gradient(#314e7c,#101d39);border:4px solid #759bd1;box-shadow:inset 0 4px 7px #0008;pointer-events:none;display:grid;place-items:center}.stickOuter:after{content:'✦';position:absolute;color:#84b7ff88;font-size:65px;line-height:1}.stickKnob{width:54%;height:54%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#cad7ec,#6d84aa 60%,#314b75);border:3px solid #c5d7f4;box-shadow:0 4px 8px #0009;z-index:1}.padlabel{font-weight:900;color:#e9f4ff;font-size:12px;margin-top:3px;pointer-events:none}#fire{height:95px;width:95px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff19a,#ff9449 60%,#e64034);color:#fff;border:5px solid #ffe0a7;text-shadow:1px 2px #8e312c;box-shadow:0 6px 0 #922e35,0 0 17px #ffb84e6b;font-size:24px;line-height:1.1}#fire.pressed{transform:translateY(4px);box-shadow:0 2px 0 #922e35}.footer{font-size:10px;color:#b6cef6;text-align:center;padding:3px;background:#111b39;flex:none}@media(max-height:650px){.top{height:43px}.controls{height:126px}#fire{height:79px;width:79px;font-size:21px}.stickOuter{height:72px;width:72px}.footer{display:none}}@media(max-width:340px){.controls{gap:8px;padding-left:8px;padding-right:8px}#fire{height:80px;width:80px}}
</style></head><body><div id="app"><div class="top"><div class="brand">ウチゲー</div><div class="topInfo"><b id="stageText">ステージ 1 / 2</b><div class="hpbar"><span id="hpFill"></span></div></div><button id="pause" class="pause" aria-label="一時停止">Ⅱ</button></div><div id="field"><canvas id="game"></canvas><div id="speech" aria-live="polite"></div><div id="overlay"><div class="panel"><h1 id="title">あいつをラスボスに！</h1><p id="description">スマホ縦画面のシューティング試作 v4。<br>左下の操作エリアを指でなぞって移動。<br>右下の攻撃を押しっぱなしで連射！<br><br>敵1もラスボスもセリフあり。<br>ラスボスは途中で変身するよ！</p><button id="start">ゲーム開始</button></div></div></div><div class="controls"><div id="pad" aria-label="移動タッチパッド"><div class="stickOuter"><div class="stickKnob"></div></div><div class="padlabel">移動エリア（なぞる）</div></div><button id="fire" aria-label="攻撃">⚡<br>攻撃</button></div><div class="footer">左下の好きな場所で指を動かす｜右下で攻撃（長押し可）</div></div><script>
(()=>{'use strict';
// 名前・セリフ・色・攻撃の種類を変更すれば別のお客様向けに再利用できるサンプル
const CONFIG={hero:{name:'主人公',color:'#4ee1ca'},bosses:[{name:'ライバル',color:'#ffa86c',speech:'負けないぞ！',defeat:'ま、まいった！',hp:16,pattern:'aim'},{name:'ラスボス',color:'#b78cff',speech:'よくここまで来たな！',transformSpeech:'これが本当の姿だ！',defeat:'そんなバカな〜！',hp:36,pattern:'spread'}],ending:'ラスボスを倒した！\n今日も平和な日常が戻ってきた。'};
const $=s=>document.getElementById(s),canvas=$('game'),ctx=canvas.getContext('2d'),field=$('field'),pad=$('pad'),fire=$('fire'),overlay=$('overlay'),speech=$('speech'),stageText=$('stageText'),hpFill=$('hpFill');let W=350,H=520,dpr=1,mode='menu',last=0,time=0,hero=null,boss=null,stage=0,transform=false,bullets=[],foeBullets=[],bits=[],stars=[],fireHeld=false,fireId=null,padId=null,lastPX=0,lastPY=0,keys={},shotCD=0,enemyCD=0,phaseDelay=0,speechUntil=0,inv=0,shock=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=field.getBoundingClientRect();W=Math.max(220,r.width);H=Math.max(220,r.height);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,v:10+Math.random()*32,r:1+Math.random()*1.7}));if(hero){hero.x=clamp(hero.x,24,W-24);hero.y=clamp(hero.y,H*.4,H-31)}}window.addEventListener('resize',resize);resize();
function say(t,sec=2){speech.textContent=t;speechUntil=time+sec}function hud(){stageText.textContent=`${stage===1&&transform?'変身ボス':`ステージ ${stage+1} / ${CONFIG.bosses.length}`}　♥ ${hero?.hp??5}`;hpFill.style.width=`${100*(hero?.hp??5)/5}%`}
function newBoss(){let c=CONFIG.bosses[stage];boss={name:c.name,x:W/2,y:Math.min(115,H*.22),t:0,hp:c.hp,max:c.hp,color:c.color,pattern:c.pattern};transform=false;foeBullets=[];bullets=[];enemyCD=1.6;phaseDelay=.65;say(`${c.name}「${c.speech}」`,2.2);hud()}
function reset(){mode='play';overlay.classList.add('hidden');hero={x:W/2,y:H*.8,hp:5};stage=0;time=0;shotCD=0;inv=0;shock=0;bits=[];fireHeld=false;newBoss()}
function finish(win){mode=win?'win':'lose';fireHeld=false;fire.classList.remove('pressed');overlay.classList.remove('hidden');$('title').textContent=win?'ゲームクリア！':'ゲームオーバー';$('description').textContent=win?CONFIG.ending:'もう一度挑戦してみよう！';$('start').textContent='もう一度遊ぶ';padId=null;fireId=null}
function puff(x,y,c,n=15){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=35+Math.random()*150;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,life:.5+Math.random()*.35})}}
function enemyFire(){if(!boss)return;let target=Math.atan2(hero.y-boss.y,hero.x-boss.x);let count=stage===0?3:transform?7:5;let speed=stage===0?100:transform?118:105;for(let i=0;i<count;i++){let spread=(i-(count-1)/2)*(stage===0?.24:transform?.27:.22);let a=target+spread;foeBullets.push({x:boss.x,y:boss.y+25,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:stage===0?6:7})}}
function update(dt){time+=dt;stars.forEach(s=>{s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});bits.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});bits=bits.filter(p=>p.life>0);if(mode!=='play')return;if(time>speechUntil)speech.textContent='';if(inv>0)inv-=dt;if(shock>0)shock-=dt;if(phaseDelay>0){phaseDelay-=dt;return}
let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),m=Math.hypot(x,y)||1;hero.x=clamp(hero.x+x/m*220*dt,22,W-22);hero.y=clamp(hero.y+y/m*220*dt,H*.38,H-27);
boss.t+=dt;boss.x=W/2+Math.sin(boss.t*(transform?2:1.4))*Math.min(W*.29,115);boss.y=Math.min(115,H*.22)+Math.sin(boss.t*1.6)*9;
shotCD-=dt;if((fireHeld||keys[' ']||keys.Enter)&&shotCD<=0){bullets.push({x:hero.x,y:hero.y-27,vy:-530});shotCD=.125}enemyCD-=dt;if(enemyCD<=0){enemyFire();enemyCD=stage===0?1.3:transform?.72:1.07}
for(let b of bullets)b.y+=b.vy*dt;for(let b of foeBullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
for(let b of bullets){if(Math.hypot(b.x-boss.x,b.y-boss.y)<(transform?43:34)){b.dead=true;boss.hp--;puff(b.x,b.y,'#ffe97c',3);if(stage===1&&!transform&&boss.hp<=boss.max/2){transform=true;boss.color='#ff559b';foeBullets=[];bullets=[];phaseDelay=2;shock=.6;puff(boss.x,boss.y,'#fca5ff',50);say(`${boss.name}「${CONFIG.bosses[stage].transformSpeech}」`,2.2);hud();break}if(boss.hp<=0){puff(boss.x,boss.y,boss.color,40);say(`${boss.name}「${CONFIG.bosses[stage].defeat}」`,1.7);stage++;if(stage===CONFIG.bosses.length){phaseDelay=100;setTimeout(()=>{if(mode==='play')finish(true)},1500)}else{phaseDelay=100;setTimeout(()=>{if(mode==='play')newBoss()},1600)}hud();break}}}
if(inv<=0){for(let b of foeBullets){if(Math.hypot(b.x-hero.x,b.y-hero.y)<b.r+14){b.dead=true;hero.hp--;inv=1.25;shock=.2;puff(hero.x,hero.y,'#ffa5ac',15);hud();if(hero.hp<=0){finish(false);return}break}}}
bullets=bullets.filter(b=>!b.dead&&b.y>-20);foeBullets=foeBullets.filter(b=>!b.dead&&b.y<H+20&&b.x>-20&&b.x<W+20)}
function disk(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function face(x,y,color,isHero,monster){ctx.save();ctx.translate(x,y);ctx.shadowColor='#0007';ctx.shadowBlur=9;disk(0,12,isHero?19:monster?44:32,color);ctx.shadowBlur=0;if(!isHero){ctx.fillStyle=monster?'#712049':'#563267';ctx.beginPath();ctx.moveTo(-21,-17);ctx.lineTo(-17,-49);ctx.lineTo(0,-34);ctx.lineTo(17,-49);ctx.lineTo(21,-17);ctx.fill()}disk(0,-6,isHero?19:monster?36:27,isHero?'#f3c39c':monster?'#d8b9f6':'#ffd3a8');let q=isHero?7:monster?13:10;disk(-q,-10,3.5,'#25334f');disk(q,-10,3.5,'#25334f');ctx.strokeStyle='#343451';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-q-6,-19);ctx.lineTo(-q+3,-16);ctx.moveTo(q-3,-16);ctx.lineTo(q+6,-19);ctx.stroke();ctx.beginPath();ctx.arc(0,2,isHero?4:monster?11:7,0,Math.PI);ctx.stroke();if(isHero){ctx.fillStyle='#fff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('主人公',0,18)}ctx.restore()}
function draw(){let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2872af');bg.addColorStop(.58,'#2f5791');bg.addColorStop(1,'#16244d');rect(0,0,W,H,bg);stars.forEach(s=>disk(s.x,s.y,s.r,'#ffffff70'));ctx.strokeStyle='#68c8ff22';ctx.lineWidth=2;for(let i=0;i<7;i++){let yy=(time*32+i*90)%H;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}if(mode==='menu')return;
if(boss&&boss.hp>0){rect(20,13,W-40,12,'#1e2f57');rect(20,13,(W-40)*Math.max(0,boss.hp/boss.max),12,transform?'#ff50a5':'#ff9b72');ctx.fillStyle='#fff';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText(transform?'⚡ 変身した '+boss.name:'VS '+boss.name,W/2,45);face(boss.x,boss.y,boss.color,false,transform)}
if(hero){ctx.globalAlpha=inv>0&&Math.floor(time*12)%2===0?.32:1;face(hero.x,hero.y,CONFIG.hero.color,true,false);ctx.globalAlpha=1}for(let b of bullets){disk(b.x,b.y,6,'#97fbff');rect(b.x-3,b.y-14,6,17,'#f5ffff')}for(let b of foeBullets){disk(b.x,b.y,b.r+3,'#9b47ba');disk(b.x,b.y,b.r,'#ff97e0');disk(b.x-2,b.y-2,2,'#fff')}for(let p of bits){ctx.globalAlpha=clamp(p.life*2,0,1);disk(p.x,p.y,3,p.c)}ctx.globalAlpha=1;if(shock>0)rect(0,0,W,H,'#ffffff29')}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('start').addEventListener('click',()=>{if(mode==='paused')resume();else reset()});$('pause').addEventListener('click',()=>{if(mode==='play'){mode='paused';overlay.classList.remove('hidden');$('title').textContent='一時停止';$('description').textContent='準備ができたら再開してね。';$('start').textContent='再開';fireHeld=false}else if(mode==='paused'){resume()}});function resume(){mode='play';overlay.classList.add('hidden')}
// タッチパッド：見た目はスティック、操作は指の移動差分。指と主人公が重ならない。
pad.addEventListener('pointerdown',e=>{if(mode!=='play'||padId!==null)return;padId=e.pointerId;lastPX=e.clientX;lastPY=e.clientY;pad.classList.add('active');try{pad.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});pad.addEventListener('pointermove',e=>{if(e.pointerId!==padId||mode!=='play')return;hero.x=clamp(hero.x+(e.clientX-lastPX)*1.6,22,W-22);hero.y=clamp(hero.y+(e.clientY-lastPY)*1.6,H*.38,H-27);lastPX=e.clientX;lastPY=e.clientY;e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;pad.classList.remove('active')}});
fire.addEventListener('pointerdown',e=>{if(mode!=='play'||fireId!==null)return;fireId=e.pointerId;try{fire.setPointerCapture(e.pointerId)}catch{}fireHeld=true;fire.classList.add('pressed');e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,e=>{if(e.pointerId===fireId){fireId=null;fireHeld=false;fire.classList.remove('pressed')}});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>{keys[e.key]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){fireHeld=false;keys={};padId=null;fireId=null;pad.classList.remove('active');fire.classList.remove('pressed')}});
})();
</script></body></html>
