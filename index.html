$('start').addEventListener('click',()=>{if(mode==='paused'){mode='play';overlay.classList.add('hide')}else start(mode==='lose')});
// 見た目はジョイスティック、入力は安定した相対移動式タッチパッド。
pad.addEventListener('pointerdown',e=>{if(mode!=='play'||padId!==null)return;padId=e.pointerId;lastX=e.clientX;lastY=e.clientY;pad.classList.add('active');try{pad.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});pad.addEventListener('pointermove',e=>{if(padId!==e.pointerId||mode!=='play')return;let dx=e.clientX-lastX,dy=e.clientY-lastY;hero.x=clamp(hero.x+dx*1.5,21,W-21);hero.y=clamp(hero.y+dy*1.5,H*.38,H-26);knob.style.setProperty('--kx',clamp(dx*2,-17,17)+'px');knob.style.setProperty('--ky',clamp(dy*2,-17,17)+'px');lastX=e.clientX;lastY=e.clientY;e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;pad.classList.remove('active');knob.style.setProperty('--kx','0px');knob.style.setProperty('--ky','0px')}});
fire.addEventListener('pointerdown',e=>{if(mode!=='play'||fireId!==null)return;fireId=e.pointerId;fireHeld=true;fire.classList.add('down');try{fire.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,e=>{if(e.pointerId===fireId){fireId=null;fireHeld=false;fire.classList.remove('down')}});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>{keys[e.key]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){fireHeld=false;keys={};padId=null;fireId=null;pad.classList.remove('active');fire.classList.remove('down');knob.style.setProperty('--kx','0px');knob.style.setProperty('--ky','0px')}});
})();
