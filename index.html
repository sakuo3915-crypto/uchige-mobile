<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#14213e"><title>ウチゲー｜スマホ版サンプル</title><style>
:root{--ink:#14213e;--cyan:#79e9ff;--gold:#ffe26a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:system-ui,-apple-system,'Noto Sans JP','Meiryo',sans-serif;background:#071020;color:#fff;display:flex;justify-content:center}button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}#app{width:min(100%,480px);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#14213e}.hud{height:54px;flex:0 0 54px;background:linear-gradient(100deg,#244d8b,#172d54);border-bottom:3px solid #6ee7fb;display:flex;align-items:center;padding:6px 10px;gap:9px}.logo{font-size:18px;font-weight:1000;letter-spacing:.7px;color:#ffe26a;text-shadow:2px 2px #122141;white-space:nowrap}.meta{flex:1;min-width:0;font-size:12px;font-weight:900}.life{height:10px;border-radius:10px;border:1px solid #b5d9ff;background:#0e1e37;margin-top:5px;overflow:hidden}.life>div{height:100%;width:100%;background:linear-gradient(90deg,#42d5b2,#b6f77a);transition:width .15s}.pause{background:#325a95;border:2px solid #b6dafa;border-radius:9px;color:white;font-size:17px;font-weight:bold;padding:5px 10px}#field{flex:1;min-height:0;position:relative;overflow:hidden;background:#16335c}canvas{width:100%;height:100%;display:block;touch-action:none}#overlay{position:absolute;inset:0;background:#081329e8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:6}#overlay.hide{display:none}.panel{width:100%;max-width:345px;padding:23px 17px;background:linear-gradient(140deg,#1d3d77,#14264b);border:3px solid #ffd36b;border-radius:22px;box-shadow:0 18px 45px #000b;text-align:center}.panel h1{font-size:26px;line-height:1.3;color:#ffe26a;margin:0 0 12px}.panel p{white-space:pre-line;line-height:1.7;color:#e7eeff;font-size:14px;margin:0 0 19px}.panel button{background:#ffcf54;color:#202b3f;border:0;border-radius:13px;padding:13px 28px;font-size:18px;font-weight:1000;box-shadow:0 5px #ba7c26}.controls{flex:0 0 clamp(138px,24dvh,182px);background:linear-gradient(140deg,#153e79,#141e3d);border-top:3px solid #80e4ff;display:flex;gap:11px;padding:9px 13px max(10px,env(safe-area-inset-bottom));align-items:center;justify-content:space-between;touch-action:none;user-select:none;-webkit-user-select:none}#pad{height:100%;min-width:0;flex:1;max-width:245px;position:relative;border:2px solid #87b4fa;border-radius:19px;background:radial-gradient(circle,#345a91,#1b3055 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none}#pad.active{border-color:#f7e4a3;background:radial-gradient(circle,#3b689f,#1a3057 80%)}.stick{pointer-events:none;width:clamp(72px,22vw,104px);height:clamp(72px,22vw,104px);border:5px solid #7296cc;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#2b446d,#0d1b32);box-shadow:inset 0 4px 8px #0009;position:relative}.stick:before{content:'✣';color:#8dbbfb55;position:absolute;font-size:59px}.knob{height:55%;width:55%;border:3px solid #c2d6f4;border-radius:50%;background:radial-gradient(circle at 30% 26%,#e0eaf8,#6481ab 65%,#314d7c);box-shadow:0 4px 8px #0009;z-index:1;transform:translate(var(--kx,0px),var(--ky,0px));transition:transform .06s}.padLabel{font-size:11px;font-weight:900;color:#daeafe;margin-top:2px;pointer-events:none}#fire{height:clamp(81px,25vw,105px);width:clamp(81px,25vw,105px);flex:0 0 auto;border:5px solid #ffe3ad;border-radius:50%;background:radial-gradient(circle at 32% 23%,#fff5a5,#ff9e43 55%,#e64f3b);box-shadow:0 6px #9f3437,0 0 15px #ffc5636e;font-size:22px;font-weight:1000;color:white;text-shadow:1px 2px #8b3430;line-height:1.15}#fire.down{transform:translateY(4px);box-shadow:0 2px #9f3437}.foot{flex:0 0 16px;background:#101b35;color:#bcd0ef;text-align:center;font-size:10px;line-height:16px}@media(max-height:650px){.hud{height:45px;flex-basis:45px}.controls{flex-basis:126px}.foot{display:none}.stick{height:72px;width:72px}#fire{height:80px;width:80px}}
</style></head><body><main id="app"><header class="hud"><div class="logo">ウチゲー <span style="font-size:9px;color:white">DEMO</span></div><div class="meta"><div id="stage">STAGE 1 / 3　HP ♥♥♥♥♥</div><div class="life"><div id="hp"></div></div></div><button class="pause" id="pause" aria-label="一時停止">Ⅱ</button></header><div id="field"><canvas id="game" aria-label="縦シューティングゲーム"></canvas><div id="overlay"><div class="panel"><h1 id="title">あいつをラスボスにしよう。</h1><p id="desc">写真と身内ネタがゲームになる！\n\nサンプル「サクゲー」で操作をお試し。\n左下をなぞって移動、右下で攻撃。\n敵のセリフとラスボス変身にも注目！</p><button id="start">ゲーム開始</button></div></div></div><div class="controls"><div id="pad" aria-label="移動エリア"><div class="stick"><div id="knob" class="knob"></div></div><div class="padLabel">指をなぞって移動</div></div><button id="fire" aria-label="攻撃">⚡<br>攻撃</button></div><div class="foot">左下：上下左右に移動　｜　右下：長押しで攻撃</div></main><script>
(()=>{'use strict';
// 注文ごとに差し替えるデータ。ゲームエンジンと顧客データを分離したデモ。
const GAME={title:'サクゲー ～ヒデアキの逆襲～',hero:{name:'ヒデアキ',attack:'ハゲビーム',lines:['ハゲビーム！','いくぞ！'],color:'#49bbdc'},bosses:[{name:'シュウ',kind:'tear',color:'#a584eb',hp:15,lines:['ベイ！ベイ！','うわぁぁん！','ベイッ！'],defeat:'うわぁん！'},{name:'カイ',kind:'sick',color:'#73b985',hp:18,lines:['ゲロ！','ゲロゲロ！','うぷっ…'],defeat:'ゲロォ…'},{name:'エリコ',kind:'ping',color:'#e9987e',hp:36,lines:['勝負よ！','走れメロス！','いくわよ！'],defeat:'エビ…',transform:{name:'エビコ',kind:'shrimp',color:'#f08b3d',line:'エリコはエビコになった！',lines:['エビフライ！','エビッ！','まだまだ！']}}],ending:'ヒデアキは平和な日常を取り戻し、\n楽しく麻雀をして過ごしましたとさ。'};
const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),field=$('field'),pad=$('pad'),knob=$('knob'),fire=$('fire'),overlay=$('overlay');const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let W=360,H=500,dpr=1,last=0,t=0,mode='menu',hero=null,boss=null,stage=0,transformed=false,shots=[],enemyShots=[],particles=[],stars=[],shotTimer=0,enemyTimer=0,bubble=null,bubbleTimer=0,inv=0,lock=0,fireHeld=false,fireId=null,padId=null,lastX=0,lastY=0,keys={},stageToken=0;
function resize(){const r=field.getBoundingClientRect();W=Math.max(r.width,240);H=Math.max(r.height,250);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:50},()=>({x:R(0,W),y:R(0,H),v:R(8,34),r:R(.6,1.7)}));if(hero){hero.x=clamp(hero.x,20,W-20);hero.y=clamp(hero.y,H*.38,H-25)}if(boss){boss.x=clamp(boss.x,45,W-45)}}window.addEventListener('resize',resize);resize();
function say(who,txt,secs=2){bubble={who,txt,until:t+secs}}function cfg(){return GAME.bosses[stage]}function hud(){let n=Math.min(stage+1,GAME.bosses.length);$('stage').textContent=`STAGE ${n} / ${GAME.bosses.length}　HP ${'♥'.repeat(Math.max(hero?.hp||0,0))}`;$('hp').style.width=`${Math.max(0,hero?.hp||0)*20}%`}
function newStage(){let b=cfg();if(!b)return;boss={x:W/2,y:Math.max(60,Math.min(110,H*.19)),hp:b.hp,max:b.hp,age:0};transformed=false;shots=[];enemyShots=[];enemyTimer=1.65;lock=.75;bubbleTimer=3.3;say('boss',`${b.name}「${b.lines[0]}」`,2.4);hud()}
function start(){++stageToken;t=0;mode='play';overlay.classList.add('hide');hero={x:W/2,y:H*.79,hp:5};stage=0;inv=0;lock=0;shotTimer=0;fireHeld=false;fireId=null;padId=null;particles=[];newStage()}
function end(win){mode=win?'win':'lose';fireHeld=false;fire.classList.remove('down');overlay.classList.remove('hide');$('title').textContent=win?'ゲームクリア！':'ゲームオーバー';$('desc').textContent=win?GAME.ending:'もう一度挑戦してみよう！\n敵の弾を避けて、攻撃ボタンを長押し！';$('start').textContent='もう一度遊ぶ'}
function next(){let tok=stageToken;lock=999;shots=[];enemyShots=[];setTimeout(()=>{if(mode!=='play'||tok!==stageToken)return;stage++;if(stage>=GAME.bosses.length){end(true)}else{newStage()}},1400)}
function spark(x,y,color,count=12){for(let i=0;i<count;i++){let a=R(0,Math.PI*2),s=R(30,150);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:R(.3,.8)})}}
function currentKind(){return transformed?cfg().transform.kind:cfg().kind}function currentName(){return transformed?cfg().transform.name:cfg().name}
function enemyFire(){let kind=currentKind(),n=kind==='tear'?3:kind==='sick'?4:kind==='ping'?5:7;let base=Math.atan2(hero.y-boss.y,hero.x-boss.x),speed=kind==='tear'?106:kind==='sick'?110:kind==='ping'?120:130;for(let i=0;i<n;i++){let theta=base+(i-(n-1)/2)*(kind==='shrimp'?.23:.19);enemyShots.push({x:boss.x,y:boss.y+21,vx:Math.cos(theta)*speed,vy:Math.sin(theta)*speed,kind,r:kind==='shrimp'?10:kind==='tear'?7:8,spin:R(0,6)})}}
function update(dt){t+=dt;for(let s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=R(0,W)}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(mode!=='play')return;if(inv>0)inv-=dt;if(lock>0){lock-=dt;return}let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),l=Math.hypot(dx,dy)||1;hero.x=clamp(hero.x+dx/l*235*dt,21,W-21);hero.y=clamp(hero.y+dy/l*235*dt,H*.38,H-26);
 boss.age+=dt;boss.x=W/2+Math.sin(boss.age*(transformed?2.6:1.5))*Math.min(W*.26,104);boss.y=Math.min(105,H*.19)+Math.cos(boss.age*1.4)*10;
 shotTimer-=dt;if((fireHeld||keys[' ']||keys.Enter)&&shotTimer<=0){shots.push({x:hero.x,y:hero.y-23,vy:-450});shotTimer=.16;if(Math.random()<.23)say('hero',GAME.hero.lines[0],.65)}enemyTimer-=dt;if(enemyTimer<=0){enemyFire();enemyTimer=currentKind()==='shrimp'?.73:currentKind()==='ping'?.94:1.2}
 bubbleTimer-=dt;if(bubbleTimer<=0){let arr=transformed?cfg().transform.lines:cfg().lines;say('boss',`${currentName()}「${arr[Math.floor(R(0,arr.length))]}」`,1.75);bubbleTimer=R(2.9,4.2)}
 for(let s of shots)s.y+=s.vy*dt;for(let s of enemyShots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.spin+=dt*8}
 for(let s of shots){if(Math.hypot(s.x-boss.x,s.y-boss.y)<(transformed?47:37)){s.dead=true;boss.hp--;spark(s.x,s.y,'#ffed97',2);if(!transformed&&cfg().transform&&boss.hp<=boss.max*.5){transformed=true;boss.hp=Math.max(boss.hp,1);enemyShots=[];shots=[];lock=1.35;spark(boss.x,boss.y,'#ffa3e6',42);say('boss',cfg().transform.line,2.7);bubbleTimer=3.6;break}if(boss.hp<=0){spark(boss.x,boss.y,'#ffb96f',42);say('boss',`${currentName()}「${cfg().defeat}」`,1.3);next();break}}}
 if(inv<=0){for(let s of enemyShots){if(Math.hypot(s.x-hero.x,s.y-hero.y)<s.r+12){s.dead=true;hero.hp--;inv=1.2;spark(hero.x,hero.y,'#ff9aa8',16);hud();if(hero.hp<=0){end(false);return}break}}}
 shots=shots.filter(s=>!s.dead&&s.y>-40);enemyShots=enemyShots.filter(s=>!s.dead&&s.y<H+30&&s.x>-30&&s.x<W+30)}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawHero(){if(inv>0&&Math.floor(t*12)%2===0)return;ctx.save();ctx.translate(hero.x,hero.y);ctx.shadowColor='#070c20';ctx.shadowBlur=9;rr(-18,-5,36,30,10,'#52b7dc','#155981');circle(0,-17,19,'#eec49f');ctx.shadowBlur=0;ctx.strokeStyle='#36435a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-8,-18,7,0,Math.PI*2);ctx.moveTo(-1,-18);ctx.lineTo(1,-18);ctx.arc(8,-18,7,0,Math.PI*2);ctx.stroke();circle(-8,-18,1.7,'#1a2c40');circle(8,-18,1.7,'#1a2c40');line(-4,-8,4,-8,'#724e4b',2);ctx.restore()}
function drawBoss(){let b=cfg(),kind=currentKind();ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowColor='#001024';ctx.shadowBlur=10;let color=transformed?b.transform.color:b.color;rr(-31,-8,62,54,16,color,'#263c64');circle(0,-22,30,kind==='sick'?'#f2c7a1':'#ffd3ab');ctx.shadowBlur=0;if(kind==='tear'){circle(-13,-43,12,'#5c4b8a');circle(12,-43,12,'#5c4b8a')}else if(kind==='ping'){ctx.fillStyle='#4b2a48';ctx.beginPath();ctx.ellipse(0,-42,30,12,0,Math.PI,Math.PI*2);ctx.fill()}else if(kind==='shrimp'){ctx.font='34px system-ui';ctx.textAlign='center';ctx.fillText('🍤',0,-42)}else{ctx.fillStyle='#4b4038';ctx.beginPath();ctx.ellipse(0,-44,29,12,0,Math.PI,Math.PI*2);ctx.fill()}circle(-10,-24,3,'#24374e');circle(10,-24,3,'#24374e');ctx.strokeStyle='#704944';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-12,kind==='tear'?11:8,0,Math.PI);ctx.stroke();if(kind==='tear'){circle(-13,-11,5,'#83ddff');circle(14,-11,5,'#83ddff')}if(kind==='ping'){ctx.font='19px system-ui';ctx.fillText('🏓',25,27)}if(kind==='shrimp'){ctx.font='20px system-ui';ctx.fillText('🍤',27,24)}ctx.restore()}
function drawProjectile(s){ctx.save();ctx.translate(s.x,s.y);if(s.kind==='tear'){circle(0,0,7,'#85dbff');circle(-2,-2,2,'#f4ffff')}else if(s.kind==='sick'){circle(0,0,9,'#a16b43');circle(3,-2,4,'#bb8c63')}else if(s.kind==='ping'){circle(0,0,8,'#f5f5f3');circle(-2,-2,2,'#dce0e4')}else if(s.kind==='shrimp'){ctx.rotate(Math.sin(s.spin)*.5);ctx.font='21px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍤',0,0)}ctx.restore()}
function drawBubble(){if(!bubble||bubble.until<t||!boss)return;let isHero=bubble.who==='hero',x=isHero?hero.x:boss.x,y=isHero?hero.y-62:boss.y+54,txt=bubble.txt;if(!txt)return;ctx.save();let fontSize=txt.length>16?12:14;ctx.font=`900 ${fontSize}px system-ui`;let bw=Math.min(W-16,Math.max(105,ctx.measureText(txt).width+25)),bh=35;x=clamp(x,8+bw/2,W-8-bw/2);y=clamp(y,18,H-18);rr(x-bw/2,y-bh/2,bw,bh,13,'#fffef5','#2b3b61');ctx.fillStyle='#1c3054';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y, bw-14);ctx.restore()}
function draw(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#58ace3');grad.addColorStop(.45,'#437cb5');grad.addColorStop(1,'#17395e');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let s of stars)circle(s.x,s.y,s.r,'#e2fbff96');ctx.fillStyle='#123b6866';for(let i=0;i<8;i++){let y=(i*100+(t*20)%100)%H;ctx.fillRect(0,y,W,3)}ctx.fillStyle='#163d5488';ctx.beginPath();ctx.moveTo(0,H*.78);for(let i=0;i<=W;i+=30)ctx.lineTo(i,H*.78+Math.sin(i*.037)*13);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();if(mode==='menu')return;
 if(boss&&boss.hp>0){rr(14,10,W-28,14,8,'#1a3157','#aed1ff');rr(16,12,(W-32)*clamp(boss.hp/boss.max,0,1),10,5,transformed?'#fd549f':'#ffa65e');ctx.font='900 12px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(transformed?'FINAL  VS エビコ':`VS ${currentName()}`,W/2,43);drawBoss()}if(hero)drawHero();for(let s of shots){rr(s.x-4,s.y-14,8,21,4,'#b8faff');circle(s.x,s.y-11,6,'#efffff')}for(let s of enemyShots)drawProjectile(s);for(let p of particles){ctx.globalAlpha=clamp(p.life*1.7,0,1);circle(p.x,p.y,3,p.color)}ctx.globalAlpha=1;drawBubble();if(inv>0){} }
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
$('start').addEventListener('click',()=>{if(mode==='paused'){mode='play';overlay.classList.add('hide')}else start()});$('pause').addEventListener('click',()=>{if(mode==='play'){mode='paused';fireHeld=false;fire.classList.remove('down');$('title').textContent='一時停止';$('desc').textContent='再開を押すと続きから遊べるよ。';$('start').textContent='再開';overlay.classList.remove('hide')}else if(mode==='paused'){mode='play';overlay.classList.add('hide')}});
// 見た目はジョイスティック、入力は安定した相対移動式タッチパッド。
pad.addEventListener('pointerdown',e=>{if(mode!=='play'||padId!==null)return;padId=e.pointerId;lastX=e.clientX;lastY=e.clientY;pad.classList.add('active');try{pad.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});pad.addEventListener('pointermove',e=>{if(padId!==e.pointerId||mode!=='play')return;let dx=e.clientX-lastX,dy=e.clientY-lastY;hero.x=clamp(hero.x+dx*1.5,21,W-21);hero.y=clamp(hero.y+dy*1.5,H*.38,H-26);knob.style.setProperty('--kx',clamp(dx*2,-17,17)+'px');knob.style.setProperty('--ky',clamp(dy*2,-17,17)+'px');lastX=e.clientX;lastY=e.clientY;e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;pad.classList.remove('active');knob.style.setProperty('--kx','0px');knob.style.setProperty('--ky','0px')}});
fire.addEventListener('pointerdown',e=>{if(mode!=='play'||fireId!==null)return;fireId=e.pointerId;fireHeld=true;fire.classList.add('down');try{fire.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,e=>{if(e.pointerId===fireId){fireId=null;fireHeld=false;fire.classList.remove('down')}});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>{keys[e.key]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){fireHeld=false;keys={};padId=null;fireId=null;pad.classList.remove('active');fire.classList.remove('down');knob.style.setProperty('--kx','0px');knob.style.setProperty('--ky','0px')}});
})();
</script></body></html>
