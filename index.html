const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d'),field=$('field'),pad=$('pad'),knob=$('knob'),fire=$('fire'),overlay=$('overlay'),special=$('special'),specialCount=$('specialCount');const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let W=360,H=500,dpr=1,last=0,t=0,mode='menu',hero=null,boss=null,stage=0,transformed=false,shots=[],enemyShots=[],particles=[],stars=[],shotTimer=0,enemyTimer=0,bubble=null,bubbleTimer=0,inv=0,lock=0,fireHeld=false,fireId=null,padId=null,lastX=0,lastY=0,keys={},stageToken=0,specialHits=0,specialUsed=false,chargeEffect=0,melosTimer=0,melosActive=0,mamachariEffect=0,mamaRush=null,melosRun=null,beer=null,beerDropped=false,beerDelay=0,stageElapsed=0;

function say(who,txt,secs=2){bubble={who,txt,until:t+secs}}function cfg(){return GAME.bosses[stage]}function hud(){let n=Math.min(stage+1,GAME.bosses.length);$('stage').textContent=`STAGE ${n} / ${GAME.bosses.length}　HP ${'♥'.repeat(Math.max(hero?.hp||0,0))}`;$('hp').style.width=`${Math.max(0,hero?.hp||0)*20}%`}

function currentKind(){return transformed?cfg().transform.kind:cfg().kind}function currentName(){return transformed?cfg().transform.name:cfg().name}
function enemyFire(){let kind=currentKind(),n=kind==='tear'?3:kind==='sick'?4:kind==='ping'?5:4;let base=Math.atan2(hero.y-boss.y,hero.x-boss.x),speed=kind==='tear'?106:kind==='sick'?110:kind==='ping'?120:100;for(let i=0;i<n;i++){let theta=base+(i-(n-1)/2)*(kind==='shrimp'?.30:.19);enemyShots.push({x:boss.x,y:boss.y+21,vx:Math.cos(theta)*speed,vy:Math.sin(theta)*speed,kind,r:kind==='shrimp'?7:kind==='tear'?7:8,spin:R(0,6)})}}
function update(dt){t+=dt;for(let s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=R(0,W)}}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(mode!=='play')return;if(inv>0)inv-=dt;

    ctx.beginPath();ctx.ellipse(-j*18,(j%2)*16,22,5,-.25,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  ctx.translate(Math.sin(p*65)*4,Math.sin(p*45)*2);ctx.rotate(Math.sin(p*35)*.13);
 }
 ctx.shadowColor=transformed?'#ff9b45':'#081631';ctx.shadowBlur=transformed?17:10;
 const key=kind==='tear'?'shuei':kind==='sick'?'kaiei':kind==='ping'?'eriko':'ebiko';
 // 立ち絵をオリジナルのキャラクター画像に置き換え。ゲーム処理は変更しない。
 sprite(key,0,0,kind==='ping'?98:kind==='shrimp'?82:86,kind==='ping'?117:108);
 if(melosRun){
  const k=Math.sin(melosRun.elapsed*34)*21;
  line(-13,48,-20+k,76,'#39385d',7);line(13,48,20-k,76,'#39385d',7);
  ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff98c';
  ctx.fillText('ダダダッ！',0,-77);
 }
 ctx.restore();
}
function drawProjectile(s){
 ctx.save();ctx.translate(s.x,s.y);
 if(s.kind==='tear'){
  ctx.rotate(-.2);ctx.fillStyle='#42baff';ctx.strokeStyle='#e6faff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-12);ctx.bezierCurveTo(-13,1,-8,10,0,11);ctx.bezierCurveTo(9,11,13,1,0,-12);ctx.fill();ctx.stroke();circle(-3,2,2,'#fff');
 }else if(s.kind==='sick'){
  ctx.rotate(s.spin*.25);ctx.fillStyle='#8a542d';ctx.strokeStyle='#502a14';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.stroke();circle(-3,-3,3,'#c59a64');circle(4,3,2,'#b37c45');
 }else if(s.kind==='ping'){
  circle(1,1,9,'#a7b5c5');circle(0,0,8,'#fff');circle(-3,-3,2,'#ecf7ff');
 }else if(s.kind==='shrimp'){
  ctx.rotate(Math.sin(s.spin)*.32);ctx.font='22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍤',0,0);
 }
 ctx.restore();
}
function drawMamaBike(){
 if(!mamaRush)return;
 const a=mamaRush,p=clamp(a.elapsed/a.duration,0,1);
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(-.08+Math.sin(p*45)*.04);
 ctx.shadowColor='#ffd348';ctx.shadowBlur=16;
 // Large, recognizable bicycle: spinning wheels, triangular frame, handlebar, saddle
 for(const x of [-32,32]){
  ctx.fillStyle='#122c55';ctx.strokeStyle='#f4f9ff';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(x,10,19,0,Math.PI*2);ctx.fill();ctx.stroke();
  for(let k=0;k<6;k++){let ang=p*24+k*Math.PI/3;line(x,10,x+15*Math.cos(ang),10+15*Math.sin(ang),'#bcc8dd',1.6)}
 }
 line(-32,10,-5,-16,'#ffe75e',6);line(-5,-16,10,10,'#ffe75e',6);
 line(10,10,-32,10,'#ffe75e',6);line(-5,-16,32,10,'#ffe75e',6);
 line(10,10,17,-30,'#ffe75e',5);line(17,-30,36,-30,'#ffe75e',5);
 line(-12,-18,3,-18,'#172a48',5);
 ctx.shadowBlur=0;
 sprite('hero',-6,-41,56,75);
 ctx.fillStyle='#ffb833';ctx.font='bold 18px system-ui';ctx.textAlign='center';
 ctx.fillText('💨',-60,5);ctx.restore();
 }
function drawBubble(){if(!bubble||bubble.until<t||!boss)return;let isHero=bubble.who==='hero',x=isHero?hero.x:boss.x,y=isHero?hero.y-62:boss.y+54,txt=bubble.txt;if(!txt)return;ctx.save();let fontSize=txt.length>16?12:14;ctx.font=`900 ${fontSize}px system-ui`;let bw=Math.min(W-16,Math.max(105,ctx.measureText(txt).width+25)),bh=35;x=clamp(x,8+bw/2,W-8-bw/2);y=clamp(y,18,H-18);rr(x-bw/2,y-bh/2,bw,bh,13,'#fffef5','#2b3b61');ctx.fillStyle='#1c3054';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y, bw-14);ctx.restore()}
function draw(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#58ace3');grad.addColorStop(.45,'#437cb5');grad.addColorStop(1,'#17395e');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let s of stars)circle(s.x,s.y,s.r,'#e2fbff96');ctx.fillStyle='#123b6866';for(let i=0;i<8;i++){let y=(i*100+(t*20)%100)%H;ctx.fillRect(0,y,W,3)}ctx.fillStyle='#163d5488';ctx.beginPath();ctx.moveTo(0,H*.78);for(let i=0;i<=W;i+=30)ctx.lineTo(i,H*.78+Math.sin(i*.037)*13);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();if(mode==='menu')return;
 if(boss&&boss.hp>0){rr(14,10,W-28,14,8,'#1a3157','#aed1ff');rr(16,12,(W-32)*clamp(boss.hp/boss.max,0,1),10,5,transformed?'#fd549f':'#ffa65e');ctx.font='900 12px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(transformed?'FINAL  VS エビコ':`VS ${currentName()}`,W/2,43);drawBoss()}if(hero)drawHero();for(let s of shots){ctx.save();ctx.shadowColor='#fff2a0';ctx.shadowBlur=18;rr(s.x-5,s.y-19,10,32,5,'#ffe34e');rr(s.x-2,s.y-23,4,35,2,'#ffffff');circle(s.x,s.y-22,6,'#fffbcd');ctx.restore()}for(let s of enemyShots)drawProjectile(s);
 if(beer){
   ctx.save();ctx.translate(beer.x,beer.y);
   ctx.rotate(Math.sin(beer.spin)*.11);
   ctx.shadowColor='#ffdd4e';ctx.shadowBlur=13;
   ctx.font='31px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText('🍺',0,0);ctx.restore();
 }
 for(let p of particles){ctx.globalAlpha=clamp(p.life*1.7,0,1);circle(p.x,p.y,3,p.color)}ctx.globalAlpha=1;
 if(mamaRush){
  const a=mamaRush,p=clamp(a.elapsed/a.duration,0,1);
  ctx.save();ctx.globalAlpha=.6;
  for(let i=0;i<7;i++){
    const ty=a.y+45+i*22;
    line(a.x-36,ty,a.x-30,ty+14,'#fffab5',3);
    line(a.x+36,ty,a.x+30,ty+14,'#fffab5',3);
  }
  ctx.restore();
  drawMamaBike();
  if(p>.78&&p<.96){
   ctx.save();ctx.globalAlpha=.65;circle(boss.x,boss.y,44+Math.sin(p*45)*12,'#fff4a1');ctx.restore();
  }
  ctx.save();ctx.fillStyle='#fff8a6';ctx.strokeStyle='#3a315e';ctx.lineWidth=5;
  ctx.font='900 20px system-ui';ctx.textAlign='center';
  ctx.strokeText('ママチャリアタック！',W/2,H*.50);
  ctx.fillText('ママチャリアタック！',W/2,H*.50);ctx.restore();
 }
 if(melosRun){
  ctx.save();ctx.font='900 21px system-ui';ctx.textAlign='center';
  ctx.strokeStyle='#18284d';ctx.lineWidth=5;ctx.fillStyle='#fff18b';
  ctx.strokeText('走れメロス！',W/2,H*.34);
  ctx.fillText('走れメロス！',W/2,H*.34);ctx.restore();
 }
 drawBubble();if(inv>0){} }
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
special.addEventListener('pointerdown',e=>{
 if(mode!=='play'||!transformed||!boss||boss.hp<=0||specialUsed)return;
 e.preventDefault();specialHits++;
 specialCount.textContent=`連打 ${Math.min(8,specialHits)}/8`;
 if(specialHits<8)return;
 specialHits=0;specialUsed=true;special.classList.remove('show');
 mamachariEffect=0;
 mamaRush={elapsed:0,duration:1.65,x0:hero.x,y0:hero.y,x1:boss.x,y1:boss.y+55,x:hero.x,y:hero.y,hit:false};
 say('hero','ママチャリアタック！',1.65);
 enemyShots=[];
});
$('start').addEventListener('click',()=>{if(mode==='paused'){mode='play';overlay.classList.add('hide')}else start(mode==='lose')});
// 見た目はジョイスティック、入力は安定した相対移動式タッチパッド。
pad.addEventListener('pointerdown',e=>{if(mode!=='play'||padId!==null)return;padId=e.pointerId;lastX=e.clientX;lastY=e.clientY;pad.classList.add('active');try{pad.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});pad.addEventListener('pointermove',e=>{if(padId!==e.pointerId||mode!=='play')return;let dx=e.clientX-lastX,dy=e.clientY-lastY;hero.x=clamp(hero.x+dx*1.5,21,W-21);hero.y=clamp(hero.y+dy*1.5,H*.38,H-26);knob.style.setProperty('--kx',clamp(dx*2,-17,17)+'px');knob.style.setProperty('--ky',clamp(dy*2,-17,17)+'px');lastX=e.clientX;lastY=e.clientY;e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===padId){padId=null;pad.classList.remove('active');knob.style.setProperty('--kx','0px');knob.style.setProperty('--ky','0px')}});
fire.addEventListener('pointerdown',e=>{if(mode!=='play'||fireId!==null)return;fireId=e.pointerId;fireHeld=true;fire.classList.add('down');try{fire.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,e=>{if(e.pointerId===fireId){fireId=null;fireHeld=false;fire.classList.remove('down')}});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>{keys[e.key]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){fireHeld=false;keys={};padId=null;fireId=null;pad.classList.remove('active');fire.classList.remove('down');knob.style.setProperty('--kx','0px');knob.style.setProperty('--ky','0px')}});
})();
